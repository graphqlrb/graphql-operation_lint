rules:
  unique-operation-name:
    duplicate:
      message: 'Operation `%{name}` はすでに定義されています。'
      suggestion: '選択した範囲で一意になる名前を付けてください。'
  unique-fragment-name:
    duplicate:
      message: 'Fragment `%{name}` はすでに定義されています。'
      suggestion: '一意な名前を付け、対応する展開箇所を更新してください。'
  no-unused-fragments:
    unused:
      message: 'Fragment `%{name}` はどの Operation からも使われていません。'
      suggestion: 'Fragment を削除するか、Operation から展開してください。'
  no-one-place-fragments:
    single_spread:
      message: 'Fragment `%{name}` の展開箇所は1か所です。'
      suggestion: '展開箇所に選択セットを直接書いてください。'
  no-deprecated:
    deprecated:
      message: '`%{operation}` は非推奨の要素 `%{coordinate}` を使っています。非推奨理由は「%{reason}」です。'
      suggestion: '理由に書かれた代替手段に移行してください。'
  no-anonymous-operations:
    anonymous:
      message: 'Operation `%{operation}` に名前がありません。'
      suggestion: 'Operation に一意な名前を付けてください。'
  naming-convention:
    invalid:
      message: '`%{name}` は名前の規約に合っていません。'
      suggestion: '`%{candidate}` のような名前を付けてください。'
    fragment_prefix:
      message: 'Fragment `%{name}` の名前が型条件 `%{type}` で始まっていません。'
      suggestion: '`%{candidate}` に改名し、対応する展開箇所を更新してください。'
  match-document-filename:
    mismatch:
      message: 'ファイル名 `%{actual}` が規約に合っていません。期待するファイル名は `%{expected}` です。'
      suggestion: 'ファイル名を `%{expected}` に変えてください。'
  max-operations-per-file:
    exceeded:
      message: 'ファイル内の定義が %{count} 件あり、上限 %{max} 件を超えています。'
      suggestion: '定義を別のファイルに分けてください。'
  lone-executable-definition:
    mixed:
      message: '1つのファイルに実行可能な定義が複数あります。'
      suggestion: '定義ごとにファイルを分けてください。'
  selection-set-depth:
    exceeded:
      message: 'Operation `%{operation}` の選択の深さが %{count} で、上限 %{max} を超えています。最も深い経路は %{path} です。'
      suggestion: 'Operation を分割するか、不要な選択を省いてください。'
  max-aliases:
    exceeded:
      message: 'Operation `%{operation}` の alias が %{count} 件あり、上限 %{max} 件を超えています。'
      suggestion: '不要な alias を省くか、Operation を分割してください。'
  max-root-fields:
    exceeded:
      message: 'Operation `%{operation}` のルート直下のフィールドが %{count} 件あり、上限 %{max} 件を超えています。'
      suggestion: 'ルートフィールドの選択を複数の Operation に分けてください。'
  max-selections:
    exceeded:
      message: 'Operation `%{operation}` が %{count} 件のフィールドを選択しており、上限 %{max} 件を超えています。'
      suggestion: '不要なフィールドを省くか、Operation を分割してください。'
  require-selections:
    missing:
      message: '型 `%{type}` 上の選択セットで `%{field}` が選択されていません。'
      suggestion: '`%{field}` を選択セットに加えてください。'
  no-duplicate-fields:
    duplicate:
      message: '同じ応答キーと引数で `%{field}` が複数回選択されています。'
      suggestion: '選択を1つにまとめてください。'
  restricted-fields:
    restricted:
      message: 'Schema 要素 `%{coordinate}` の使用が制限されています。'
      suggestion: 'この場所で使用できる Schema 要素に置き換えてください。'
    custom:
      message: '%{text}'
      suggestion: 'この場所で使用できる Schema 要素に置き換えてください。'
  spec/executable-definitions:
    message: '実行可能な文書に含められない定義があります。%{detail}'
    suggestion: 'GraphQL 仕様の検証規則を満たすように文書を修正してください。'
  spec/fields-on-correct-type:
    message: '型 `%{typeName}` にフィールド `%{fieldName}` が存在しません。'
    suggestion: 'GraphQL 仕様の検証規則を満たすように文書を修正してください。'
  spec/fragments-on-composite-type:
    message: '型 `%{typeName}` は Fragment の型条件に使用できません。'
    suggestion: 'GraphQL 仕様の検証規則を満たすように文書を修正してください。'
  spec/known-argument-names:
    message: '`%{name}` に引数 `%{argumentName}` が定義されていません。'
    suggestion: 'GraphQL 仕様の検証規則を満たすように文書を修正してください。'
  spec/known-directives:
    message: '指令が定義されていないか、この位置では使用できません。%{detail}'
    suggestion: 'GraphQL 仕様の検証規則を満たすように文書を修正してください。'
  spec/known-fragment-names:
    message: 'Fragment `%{fragment}` を解決できませんでした。'
    suggestion: 'GraphQL 仕様の検証規則を満たすように文書を修正してください。'
  spec/known-operation-types:
    message: 'Operation に対応するルート型が Schema にありません。%{detail}'
    suggestion: 'GraphQL 仕様の検証規則を満たすように文書を修正してください。'
  spec/known-type-names:
    message: '型 `%{typeName}` が存在しません。'
    suggestion: 'GraphQL 仕様の検証規則を満たすように文書を修正してください。'
  spec/lone-anonymous-operation:
    message: '無名の Operation がある文書には、他の Operation を置けません。'
    suggestion: 'GraphQL 仕様の検証規則を満たすように文書を修正してください。'
  spec/no-fragment-cycles:
    message: 'Fragment の展開に循環があります。%{fragments}'
    suggestion: 'GraphQL 仕様の検証規則を満たすように文書を修正してください。'
  spec/no-undefined-variables:
    message: '定義されていない変数が使われています。%{detail}'
    suggestion: 'GraphQL 仕様の検証規則を満たすように文書を修正してください。'
  spec/no-unused-variables:
    message: '使われていない変数があります。%{detail}'
    suggestion: 'GraphQL 仕様の検証規則を満たすように文書を修正してください。'
  spec/one-field-subscriptions:
    message: 'Subscription ではルート直下のフィールドを1件だけ選択してください。%{detail}'
    suggestion: 'GraphQL 仕様の検証規則を満たすように文書を修正してください。'
  spec/one-of-input-objects:
    message: '`@oneOf` 入力オブジェクトには null 以外の値を持つフィールドが1件必要です。%{detail}'
    suggestion: 'GraphQL 仕様の検証規則を満たすように文書を修正してください。'
  spec/other:
    message: 'GraphQL 仕様検証のエラーです。%{detail}'
    suggestion: 'GraphQL 仕様の検証規則を満たすように文書を修正してください。'
  spec/overlapping-fields-can-be-merged:
    message: '同じ応答キーを使うフィールドの選択が衝突しています。%{detail}'
    suggestion: 'GraphQL 仕様の検証規則を満たすように文書を修正してください。'
  spec/possible-fragment-spread:
    message: 'この位置では Fragment の型条件を満たせません。%{detail}'
    suggestion: 'GraphQL 仕様の検証規則を満たすように文書を修正してください。'
  spec/provided-required-arguments:
    message: '`%{name}` の必須引数が不足しています。%{detail}'
    suggestion: 'GraphQL 仕様の検証規則を満たすように文書を修正してください。'
  spec/scalar-leafs:
    message: '選択セットの有無がフィールドの型に合っていません。%{detail}'
    suggestion: 'GraphQL 仕様の検証規則を満たすように文書を修正してください。'
  spec/unique-argument-names:
    message: '引数 `%{name}` が重複しています。'
    suggestion: 'GraphQL 仕様の検証規則を満たすように文書を修正してください。'
  spec/unique-directives-per-location:
    message: '繰り返し適用できない指令が重複しています。%{detail}'
    suggestion: 'GraphQL 仕様の検証規則を満たすように文書を修正してください。'
  spec/unique-input-field-names:
    message: '入力フィールド `%{name}` が重複しています。'
    suggestion: 'GraphQL 仕様の検証規則を満たすように文書を修正してください。'
  spec/unique-variable-names:
    message: '変数 `$%{variableName}` が重複しています。'
    suggestion: 'GraphQL 仕様の検証規則を満たすように文書を修正してください。'
  spec/value-literals-of-correct-type:
    message: 'リテラルが入力型の要件を満たしていません。%{detail}'
    suggestion: 'GraphQL 仕様の検証規則を満たすように文書を修正してください。'
  spec/variables-are-input-types:
    message: '変数の型に入力型を指定してください。%{detail}'
    suggestion: 'GraphQL 仕様の検証規則を満たすように文書を修正してください。'
  spec/variables-in-allowed-position:
    message: '変数 `$%{variableName}` の型が使用位置の型と合っていません。%{detail}'
    suggestion: 'GraphQL 仕様の検証規則を満たすように文書を修正してください。'
